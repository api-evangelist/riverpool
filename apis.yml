description: >-
  Riverpool (riverpool.ai) is an early-stage, pre-launch startup building what it
  describes as the "post-modern analytics data stack" — a continuously circulating,
  self-refreshing approach to analytics data rather than a stagnant warehouse. The
  company was surfaced as a portfolio company of Lightspeed Venture Partners and added
  to the API Evangelist network for enrichment. As of this pass the public site is a
  "coming soon" landing page hosted on GitHub Pages with no launched product, developer
  portal, API documentation, OpenAPI, SDKs, or other API surface to catalog yet. This
  profile captures verified company identity and domain-security posture; API artifacts
  will be added when the product and its developer surface go live.
